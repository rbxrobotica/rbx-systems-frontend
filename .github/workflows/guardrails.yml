name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gitleaks v8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
      - name: Run gitleaks
        run: ./gitleaks detect --source . --no-banner --redact -v

  security-lint:
    runs-on: ubuntu-24.04
    steps:
      # Everything this job runs is pinned (guardrail 2): the actions to the
      # commit behind the release named beside them, pnpm and Node to exact
      # versions, the packages to pnpm-lock.yaml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # eslint.config.js carries the security rules (eslint-plugin-security,
      # the eval-family core rules and the Svelte XSS rules) as errors.
      - name: Run ESLint with the security rules
        run: pnpm exec eslint .

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download osv-scanner v2.4.0
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          chmod +x osv-scanner
      - name: Run osv-scanner on pnpm-lock.yaml
        run: ./osv-scanner scan source --lockfile pnpm-lock.yaml .
