name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-26.04
    env:
      # gitleaks reads the output of `git log -p -U0`. Left to itself, that
      # output lacks four kinds of change, so the scans below pass their own
      # options to `git log`:
      # - A merge commit, for which git prints no patch unless asked.
      #   --diff-merges=first-parent prints every line a merge has and its
      #   first parent lacks.
      # - A file whose type changes, such as a symbolic link that becomes a
      #   regular file. gitleaks adds a filter that drops it, and adds none
      #   when the scan passes options of its own.
      # - A file git takes for binary, by its content or because a line of
      #   .gitattributes says so (-diff, binary). --text prints it as text.
      # - The lines a rename leaves as they were, which matters when a file
      #   leaves a path the rules skip, such as the .env.example that
      #   .gitleaks.toml allowlists. --no-renames prints the file whole at
      #   its new path.
      LOG_OPTS: --text --no-renames --diff-merges=first-parent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The SHA-256 is the one the release publishes for this file.
      - name: Download gitleaks v8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
      # A throwaway repository with four random tokens, one in each kind of
      # change listed above: in a file that takes the place of a symbolic
      # link, typed into a merge commit, in a file that .gitattributes marks
      # -diff, and in a file renamed out of the allowlisted path. The scan,
      # with the options of the full-history scan below and the rules of
      # .gitleaks.toml, has to find all four.
      - name: Check that the scan reads what gitleaks leaves out by default
        run: |
          fixture="$RUNNER_TEMP/scan-fixture"
          token() { printf 'token = "ghp_%s"\n' "$(od -An -tx1 -N18 /dev/urandom | tr -d ' \n')"; }
          git init --quiet --initial-branch=main "$fixture"
          git -C "$fixture" config user.name fixture
          git -C "$fixture" config user.email fixture@example.invalid
          ln -s nowhere "$fixture/was-a-link.env"
          git -C "$fixture" add was-a-link.env
          git -C "$fixture" commit --quiet --message 'a symbolic link'
          rm "$fixture/was-a-link.env"
          token > "$fixture/was-a-link.env"
          git -C "$fixture" commit --quiet --all --message 'the link becomes a file'
          git -C "$fixture" switch --quiet --create side
          git -C "$fixture" commit --quiet --allow-empty --message side
          git -C "$fixture" switch --quiet main
          git -C "$fixture" merge --quiet --no-ff --no-commit side
          token > "$fixture/typed-into-the-merge.env"
          git -C "$fixture" add typed-into-the-merge.env
          git -C "$fixture" commit --quiet --message merge
          printf 'marked-as-binary.env -diff\n' > "$fixture/.gitattributes"
          token > "$fixture/marked-as-binary.env"
          token > "$fixture/.env.example"
          git -C "$fixture" add .gitattributes marked-as-binary.env .env.example
          git -C "$fixture" commit --quiet --message 'a file marked -diff, a file at the allowlisted path'
          git -C "$fixture" mv .env.example left-the-allowlisted-path.env
          git -C "$fixture" commit --quiet --message 'the file leaves the allowlisted path'
          ./gitleaks detect --source "$fixture" --config .gitleaks.toml --no-banner --redact --log-opts="--full-history --all $LOG_OPTS" --report-path "$RUNNER_TEMP/scan-fixture.json" || true
          for file in was-a-link.env typed-into-the-merge.env marked-as-binary.env left-the-allowlisted-path.env; do
            if ! grep -q "$file" "$RUNNER_TEMP/scan-fixture.json"; then
              echo "gitleaks did not report the token in $file" >&2
              exit 1
            fi
          done
      # gitleaks reports nothing and exits 0 when the `git log` it runs fails
      # (a commit or an option git does not know, a patch git cannot print).
      # When that `git log` succeeds but writes a line gitleaks does not
      # expect, gitleaks can stop before it has read all that git printed,
      # and it still exits 0 if it found nothing by then: a line of
      # .gitattributes that git cannot read is enough. So each scan first
      # runs the command gitleaks runs, `git log -p -U0` with the same
      # options, and stops if it fails or writes anything to standard error.
      # A pull request is scanned over its own commits first, so that a secret
      # it adds is told apart from one the repository already had.
      - name: Run gitleaks on the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r -a options <<< "$LOG_OPTS ${BASE_SHA}..${HEAD_SHA}"
          if ! warnings="$(git log -p -U0 "${options[@]}" 2>&1 > /dev/null)" || [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" >&2
            echo "git log failed or wrote the lines above, and gitleaks does not read all of its output when it does" >&2
            exit 1
          fi
          ./gitleaks detect --source . --no-banner --redact -v --log-opts="${options[*]}"
      # Every run, a pull request as much as a push to main, then scans the
      # full history of every branch and tag, as this job did before.
      - name: Run gitleaks on the full history
        run: |
          read -r -a options <<< "--full-history --all $LOG_OPTS"
          if ! warnings="$(git log -p -U0 "${options[@]}" 2>&1 > /dev/null)" || [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" >&2
            echo "git log failed or wrote the lines above, and gitleaks does not read all of its output when it does" >&2
            exit 1
          fi
          ./gitleaks detect --source . --no-banner --redact -v --log-opts="${options[*]}"

  security-lint:
    runs-on: ubuntu-24.04
    steps:
      # Everything this job runs is pinned (guardrail 2): the actions to the
      # commit behind the release named beside them, pnpm and Node to exact
      # versions, the packages to pnpm-lock.yaml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # eslint.config.js carries the security rules (eslint-plugin-security,
      # the eval-family core rules and the Svelte XSS rules) as errors.
      - name: Run ESLint with the security rules
        run: pnpm exec eslint .

  dependency-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download osv-scanner v2.4.0
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          chmod +x osv-scanner
      - name: Run osv-scanner on pnpm-lock.yaml
        run: ./osv-scanner scan source --lockfile pnpm-lock.yaml .
