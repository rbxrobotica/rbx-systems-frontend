name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rbxrobotica/rbx-ia-br

# Pattern R: build + push + promote. Image tag promotion into rbx-infra is done
# by this workflow (INFRA_DEPLOY_KEY self-push, fleet-standard robson pattern).
# The ArgoCD Image Updater path was retired: the CRD-based controller ignored
# the legacy Application annotations and promotion silently died 2026-07-28
# (rbx-infra issue #168).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SEO check
        run: pnpm seo-check

      - name: Run svelte-check
        run: pnpm check

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote image tag to rbx-infra
        env:
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          SHA_TAG: ${{ steps.meta.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$INFRA_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:rbxrobotica/rbx-infra.git /tmp/rbx-infra
          cd /tmp/rbx-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s|newTag: sha-[0-9a-f]*|newTag: ${SHA_TAG}|" \
            apps/prod/rbx-ia-br/kustomization.yml \
            apps/prod/rbxsystems-ch/kustomization.yml

          git add apps/prod/rbx-ia-br/kustomization.yml \
                  apps/prod/rbxsystems-ch/kustomization.yml

          if git diff --staged --quiet; then
            echo "No promotion needed (already at ${SHA_TAG})"
            exit 0
          fi

          git commit -m "chore(site): update rbx-ia-br image tag to ${SHA_TAG}" \
            -m "Automated promotion by rbx-systems-frontend CI." \
            -m "Triggered by: ${{ github.repository }}@${{ github.sha }}" \
            -m "[skip ci]"

          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Failed to push promotion after 3 attempts" >&2
          exit 1
