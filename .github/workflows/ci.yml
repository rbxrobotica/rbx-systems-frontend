name: build-image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/rbxrobotica/rbx-ia-br

# Build and publish the image. Promotion requires a separate reviewed
# rbx-infra change; ArgoCD follows the image pin in that repository.
#
# What these jobs run is pinned (guardrail 2), as in the security-lint job of
# guardrails.yml: the runner image to its release, the actions to the commit
# behind the release named beside them, pnpm, Node, Python and buildx to exact
# versions, the packages to pnpm-lock.yaml, and the BuildKit image and the
# Node image of docker/Dockerfile to their digests. Not pinned: the build of
# the runner image, which GitHub replaces about once a week under the same
# label, and with it the tools these jobs take from it, such as git, curl and
# the Docker engine.
jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      # The unit tests run scripts/generate-cover.py with python3 and compare
      # what it writes, byte for byte, with the committed covers.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SEO check
        run: pnpm seo-check

      - name: Run svelte-check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

  image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image tag
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
