<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="srcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22e5e5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22e5e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid dots -->
  <g fill="#1a2129">
    <circle cx="150" cy="110" r="1.4"/><circle cx="1050" cy="90" r="1.4"/>
    <circle cx="980" cy="560" r="1.4"/><circle cx="480" cy="80" r="1.2"/>
    <circle cx="720" cy="590" r="1.2"/><circle cx="1130" cy="330" r="1.2"/>
  </g>

  <!-- source: luminous origin lower-left -->
  <circle cx="285" cy="430" r="150" fill="url(#srcGlow)"/>
  <circle cx="285" cy="430" r="9" fill="#0a0f14" stroke="#22e5e5" stroke-width="2.4"/>
  <circle cx="285" cy="430" r="18" fill="none" stroke="#22e5e5" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- expanding broadcast arcs, precise and concentric -->
  <g fill="none" stroke-linecap="round">
    <path d="M 285 350 A 80 80 0 0 1 365 430" stroke="#22e5e5" stroke-width="3" opacity="0.95" filter="url(#soft)"/>
    <path d="M 285 285 A 145 145 0 0 1 430 430" stroke="#22e5e5" stroke-width="2.6" opacity="0.65" filter="url(#soft)"/>
    <path d="M 285 215 A 215 215 0 0 1 500 430" stroke="#22e5e5" stroke-width="2.2" opacity="0.42" filter="url(#soft)"/>
    <path d="M 285 140 A 290 290 0 0 1 575 430" stroke="#8b5cf6" stroke-width="2" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- signal travelling to independent readers: three clean rays -->
  <g fill="none" stroke-linecap="round">
    <path d="M 390 325 C 560 240, 760 200, 950 190" stroke="#22e5e5" stroke-opacity="0.5" stroke-width="2" filter="url(#soft)"/>
    <path d="M 455 385 C 640 350, 800 335, 985 330" stroke="#22e5e5" stroke-opacity="0.62" stroke-width="2.2" filter="url(#soft)"/>
    <path d="M 500 455 C 670 480, 810 495, 960 500" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2" filter="url(#soft)"/>
  </g>

  <!-- particles en route -->
  <g fill="#22e5e5">
    <circle cx="640" cy="262" r="2.6" opacity="0.9"/>
    <circle cx="760" cy="341" r="2.4" opacity="0.85"/>
  </g>
  <circle cx="700" cy="483" r="2.4" fill="#8b5cf6" opacity="0.75"/>

  <!-- independent receivers: separate, self-contained frames -->
  <g>
    <rect x="950" y="165" width="50" height="50" rx="6" fill="#0a0f14" stroke="#24303a" stroke-width="1.5"/>
    <rect x="950" y="165" width="50" height="50" rx="6" fill="none" stroke="#22e5e5" stroke-opacity="0.4" stroke-width="1.2" filter="url(#softer)"/>
    <circle cx="975" cy="190" r="4" fill="none" stroke="#22e5e5" stroke-width="1.6"/>

    <rect x="985" y="305" width="50" height="50" rx="6" fill="#0a0f14" stroke="#24303a" stroke-width="1.5"/>
    <rect x="985" y="305" width="50" height="50" rx="6" fill="none" stroke="#22e5e5" stroke-opacity="0.4" stroke-width="1.2" filter="url(#softer)"/>
    <circle cx="1010" cy="330" r="4" fill="none" stroke="#22e5e5" stroke-width="1.6"/>

    <rect x="960" y="475" width="50" height="50" rx="6" fill="#0a0f14" stroke="#24303a" stroke-width="1.5"/>
    <rect x="960" y="475" width="50" height="50" rx="6" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2" filter="url(#softer)"/>
    <circle cx="985" cy="500" r="4" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
  </g>

  <!-- subtle vignette -->
  <rect width="1200" height="630" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="60" filter="url(#softer)"/>
</svg>
