<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="docGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22e5e5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22e5e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#1a2129">
    <circle cx="140" cy="100" r="1.4"/><circle cx="1060" cy="95" r="1.4"/>
    <circle cx="990" cy="565" r="1.4"/><circle cx="460" cy="75" r="1.2"/>
    <circle cx="700" cy="595" r="1.2"/><circle cx="1140" cy="320" r="1.2"/>
  </g>

  <!-- the text: a luminous document -->
  <circle cx="230" cy="315" r="140" fill="url(#docGlow)"/>
  <g>
    <rect x="185" y="245" width="90" height="140" rx="6" fill="#0a0f14" stroke="#22e5e5" stroke-opacity="0.6" stroke-width="1.6"/>
    <g stroke="#22e5e5" stroke-width="2" stroke-linecap="round">
      <line x1="203" y1="272" x2="257" y2="272" opacity="0.9"/>
      <line x1="203" y1="294" x2="247" y2="294" opacity="0.55"/>
      <line x1="203" y1="316" x2="257" y2="316" opacity="0.55"/>
      <line x1="203" y1="338" x2="239" y2="338" opacity="0.55"/>
      <line x1="203" y1="360" x2="251" y2="360" opacity="0.35"/>
    </g>
  </g>

  <!-- path through three deterministic gates -->
  <path d="M 275 315 C 340 315, 360 315, 410 315" stroke="#22e5e5" stroke-opacity="0.5" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#soft)"/>
  <g>
    <rect x="410" y="275" width="26" height="80" rx="4" fill="#0a0f14" stroke="#24303a" stroke-width="1.4"/>
    <line x1="423" y1="292" x2="423" y2="338" stroke="#22e5e5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect x="482" y="275" width="26" height="80" rx="4" fill="#0a0f14" stroke="#24303a" stroke-width="1.4"/>
    <line x1="495" y1="292" x2="495" y2="338" stroke="#22e5e5" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <rect x="554" y="275" width="26" height="80" rx="4" fill="#0a0f14" stroke="#24303a" stroke-width="1.4"/>
    <line x1="567" y1="292" x2="567" y2="338" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <path d="M 436 315 L 482 315 M 508 315 L 554 315" stroke="#22e5e5" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- split into the two stores: one serves, one proves -->
  <path d="M 580 315 C 660 315, 700 220, 800 205" stroke="#22e5e5" stroke-opacity="0.55" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M 580 315 C 660 315, 700 410, 800 425" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#soft)"/>

  <!-- store that serves -->
  <g>
    <rect x="800" y="160" width="230" height="90" rx="8" fill="#0a0f14" stroke="#24303a" stroke-width="1.5"/>
    <rect x="800" y="160" width="230" height="90" rx="8" fill="none" stroke="#22e5e5" stroke-opacity="0.45" stroke-width="1.2" filter="url(#softer)"/>
    <g stroke="#22e5e5" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <line x1="824" y1="190" x2="960" y2="190"/>
      <line x1="824" y1="212" x2="928" y2="212"/>
    </g>
  </g>

  <!-- store that proves -->
  <g>
    <rect x="800" y="380" width="230" height="90" rx="8" fill="#0a0f14" stroke="#24303a" stroke-width="1.5"/>
    <rect x="800" y="380" width="230" height="90" rx="8" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2" filter="url(#softer)"/>
    <g stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
      <line x1="824" y1="410" x2="960" y2="410"/>
      <line x1="824" y1="432" x2="928" y2="432"/>
    </g>
  </g>

  <!-- reconciliation: the byte-level comparison between the two -->
  <path d="M 915 250 C 905 290, 905 340, 915 380" stroke="#ececec" stroke-opacity="0.35" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="2 7"/>
  <path d="M 945 250 C 955 290, 955 340, 945 380" stroke="#ececec" stroke-opacity="0.35" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="930" cy="315" r="5" fill="#0a0f14" stroke="#22e5e5" stroke-width="1.6"/>
  <circle cx="930" cy="315" r="11" fill="none" stroke="#22e5e5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- particles -->
  <g fill="#22e5e5">
    <circle cx="345" cy="315" r="2.4" opacity="0.9"/>
    <circle cx="712" cy="243" r="2.4" opacity="0.8"/>
  </g>
  <circle cx="712" cy="388" r="2.4" fill="#8b5cf6" opacity="0.7"/>

  <rect width="1200" height="630" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="60" filter="url(#softer)"/>
</svg>
