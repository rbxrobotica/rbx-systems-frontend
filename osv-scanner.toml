# osv-scanner exceptions (Guardrails CI, dependency-scan job).
#
# Every entry here is a documented, dated exception of one of two kinds:
#
# 1. A finding whose only fix is a semver-major we cannot take yet (or that
#    has no fix at all), AND whose vulnerable code path is not used by this
#    site.
# 2. A finding the installed release already fixes while the advisory still
#    lists that release as affected (a backport the advisory's range does not
#    name). The entry says where the fix is in the installed release, and it
#    is removed as soon as the advisory's range is corrected.
#
# Never add an entry for a finding that has a compatible fix that is not
# installed: update the dependency instead. Re-audit on each entry's stated
# condition. Same discipline as ldamasio/robson's osv-scanner.toml.

[[IgnoredVulns]]
id = "GHSA-27mw-82g8-phjj"
reason = "@sveltejs/kit: XSS via an untrusted cache-control header inserted into a prerendered page's <meta http-equiv> tag. Already fixed in the installed release (kind 2 above). The advisory lists every version below 3.0.0 as affected, but the fix was backported to the 2.x line (sveltejs/kit commit 0a2e58cbccdd46cac20aa5af4e2edf17e0da11dd, 'backport security fixes to version 2', changeset clean-headers-escape) and is in @sveltejs/kit 2.70.4: src/runtime/server/page/render.js writes that value through escape_html(state.prerendering.cache, true), where 2.70.2 wrote it raw. The scanner still reports it only because the advisory's range was not updated, so this entry covers stale advisory metadata, not an accepted vulnerability. Independently of the fix, this site prerenders nothing (adapter-node, SSR reading content from object storage; `grep -rn 'prerender\\|setHeaders' src` is empty), so that code never runs here. Remove this entry when the advisory's range names the 2.x fix. Until then, check the escape in render.js again on any change of the kit version that stays below 3.0.0, and keep the range in package.json at ^2.70.4 or above. (2026-10-24; rewritten 2026-11-14 with the move to 2.70.4)"

[[IgnoredVulns]]
id = "GHSA-pfhg-q3qv-9q6r"
reason = "@sveltejs/kit < 3.0.0: open redirect through enhanced form actions (use:enhance) on routes that accept paths beginning with '//', e.g. catch-all routes. This site has no form actions and no use:enhance (`grep -rln 'use:enhance' src` is empty); its only catch-all routes are GET asset proxies under /api/assets and /api/blog/cover. The advisory's precondition (an enhanced form action resolving a protocol-relative action path) does not exist here. Fix is kit 3.0.0, a semver-major. Re-evaluate when the SvelteKit 3 upgrade lands or if form actions are introduced. (2026-10-24)"

[[IgnoredVulns]]
id = "GHSA-3r8g-jcqq-3p5j"
reason = "@sveltejs/kit >= 2.42.0, < 3.1.1: DoS while parsing the form data of a remote function. convert_formdata() calls FormData.getAll() once per key, quadratic in the number of entries, so a crafted request can block the event loop. The advisory states it only affects applications that turn on the experimental remote functions flag and use the `form`, `query` or `command` remote functions. This site does neither: svelte.config.js has no kit.experimental block (remoteFunctions defaults to false in kit's core/config/options.js), there is no *.remote.* module (`find src -name '*.remote.*'` is empty) and nothing imports $app/server (`grep -rn 'app/server' src` is empty). With the flag off the kit vite plugin does not register plugin_remote, the built server manifest carries `remotes: {}`, and both server entry points of that parser (handle_remote_call_internal and handle_remote_form_post_internal in kit's src/runtime/server/remote.js) look the request's hash up in manifest._.remotes and answer 404/405 before they read the body. Fix is kit 3.1.1, a semver-major: the 2.x backport (sveltejs/kit commit 0a2e58cbccdd46cac20aa5af4e2edf17e0da11dd, released as 2.70.4, the last 2.x) covers 'security fixes for non-experimental features' only, and 2.70.4 still has the getAll() loop in src/runtime/form-utils.js. Re-evaluate when the SvelteKit 3 upgrade lands, or before kit.experimental.remoteFunctions is ever enabled (do not enable it on 2.x). (2026-11-23)"

[[IgnoredVulns]]
id = "GHSA-6cf5-gc4q-fm3x"
reason = "@sveltejs/kit >= 2.60.1, < 3.1.1: non-exported `query.batch` remote functions can end up sharing a batch (the batch map is keyed by an id that private functions do not have distinct), so the arguments of one function are passed to another. The advisory states it only affects apps that turn on the experimental remote functions flag and declare non-exported query.batch functions. This site has neither: no kit.experimental block in svelte.config.js, no *.remote.* module, no import of $app/server and no `query.batch` anywhere (`grep -rnE 'query\\.batch|app/server' src` is empty), so the batching code in kit's src/runtime/app/server/remote/query.js is never loaded by the server. Fix is kit 3.1.1, a semver-major; it was not backported to 2.x for the same reason as GHSA-3r8g-jcqq-3p5j above (2.70.4 still keys the map by `__.id`). Re-evaluate when the SvelteKit 3 upgrade lands, or before kit.experimental.remoteFunctions is ever enabled. (2026-11-23)"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch >= 7.0.0, < 11.0.1: CPU/memory amplification in firstPhasePreProcess() from an attacker-supplied glob pattern. The only affected copy is minimatch 10.2.5 under @typescript-eslint/typescript-estree 8.61.1 (typescript-eslint, a devDependency used by `pnpm lint`); the other copy, 3.1.5 under eslint, is outside the range. typescript-estree declares minimatch ^10.2.2 up to its latest release (8.72.1), and 11.x is a rewrite of the matcher (no RegExp engine, makeRe removed), so forcing it through an override is outside the consumer's supported range. Its only call is in useProgramFromProjectService.js, matching parserOptions.projectService.allowDefaultProject globs with { dot: true }, i.e. the default optimizationLevel 1; firstPhasePreProcess only runs at optimizationLevel >= 2. eslint.config.js enables neither project nor projectService, the globs would be developer-authored config, and the SSR server (`node build`) never imports typescript-eslint, so no attacker-supplied pattern reaches the vulnerable code. Re-evaluate when typescript-eslint depends on minimatch >= 11.0.1 (then update), or if projectService/allowDefaultProject or optimizationLevel >= 2 is introduced. (2026-11-08)"
