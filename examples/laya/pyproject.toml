[project]
name = "rbx-laya-tutorial"
version = "0.1.0"
description = "CPU-only Portuguese text-classification demonstration for the RBX Journal"
requires-python = "==3.12.*"
dependencies = [
    "laya==0.4.3",
    "numpy==2.5.4",
    "torch==2.14.1+cpu",
    "transformers==5.19.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
